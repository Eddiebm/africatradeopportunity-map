name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything here must work from a clean checkout with only `npm ci` and
  # local Miniflare — no Cloudflare account, no secrets — so it runs on
  # every PR from anyone, including forks. Each step is separate and
  # individually diagnosable: a failure names exactly which check broke,
  # rather than one script silently running lint+typecheck+test+build and
  # only reporting the first failure (see docs/AUDIT.md §9 blocker #7).
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest, Workers pool / Miniflare)
        run: npm test

      - name: Build
        run: npm run build

      - name: Post-build smoke test (built worker, Workers pool / Miniflare)
        run: npm run test:build-smoke

  # Deploys only once `check` has actually passed on `main` — the `needs`
  # dependency below is what enforces "do not deploy until all required
  # checks pass" (docs/AUDIT.md §10 item 7), not an `if: always()` or
  # `continue-on-error` bypass.
  deploy:
    name: Deploy to Cloudflare
    needs: [check]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Public by design (this is the Turnstile SITE key, not the secret
          # key — see app/register/page.tsx and app/page.tsx's own header
          # comments). `npm run deploy` builds the client bundle as part of
          # `vinext deploy`, so this has to be present here, at build time,
          # not just as a Worker runtime secret — a runtime-only secret
          # would never reach the client-side widget that needs to render.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Sync optional Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          set +x
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | ./node_modules/.bin/wrangler secret put RESEND_API_KEY
          else
            echo "RESEND_API_KEY is not a GitHub secret — Worker email stays console/log."
          fi
          if [ -n "$EMAIL_FROM" ]; then
            printf '%s' "$EMAIL_FROM" | ./node_modules/.bin/wrangler secret put EMAIL_FROM
          fi
